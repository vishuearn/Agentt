
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }
    </style>
</head>
<body>
<script>
(function () {
    const numbers = [
        "919398837195",
        "919553271576",
        "919705677929",
        "919938652750",
        "917063487159",
        "917075979826",
        "917288994681",
        "917569926807",
        "918143611864",
        "918519945881",
        "918790699625",
        "918971136604",
        "919201769501"
    ];

    const LOCK_TIME = 10000;
    const KEY = "wa_redirect_v1";

    let saved = null;

    try {
        saved = JSON.parse(localStorage.getItem(KEY));
    } catch (e) {}

    const now = Date.now();
    let selected;

    if (
        saved &&
        numbers.includes(saved.number) &&
        now < saved.expiresAt
    ) {
        selected = saved.number;
    } else {
        const previous = saved ? saved.number : null;

        const available = numbers.filter(
            n => n !== previous
        );

        selected = available[
            Math.floor(Math.random() * available.length)
        ];

        try {
            localStorage.setItem(KEY, JSON.stringify({
                number: selected,
                expiresAt: now + LOCK_TIME
            }));
        } catch (e) {}
    }

    // Automatic random WhatsApp redirect
    window.location.replace("https://wa.me/" + selected);

    // Telegram redirect (optional)
    // window.location.href = "https://t.me/AGENTLOOTROBOT";

})();
</script>
</body>
</html>
